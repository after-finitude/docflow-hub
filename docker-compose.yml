name: docflow-hub

# Deliberately exclude owner/seed credentials and service-specific integrations.
x-runtime-environment: &runtime-environment
  LOG_LEVEL: ${LOG_LEVEL:-info}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  QUEUE_CONCURRENCY_DEFAULT: ${QUEUE_CONCURRENCY_DEFAULT:-4}
  QUEUE_CONCURRENCY_OCR: ${QUEUE_CONCURRENCY_OCR:-2}
  QUEUE_CONCURRENCY_EXTRACT: ${QUEUE_CONCURRENCY_EXTRACT:-2}
  MINIO_ENDPOINT: minio
  MINIO_PORT: 9000
  MINIO_USE_SSL: false
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  MINIO_BUCKET: ${MINIO_BUCKET}
  MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
  SIGNED_URL_TTL_SECONDS: ${SIGNED_URL_TTL_SECONDS:-900}
  # Provider identity is public configuration; credentials are scoped below.
  OCR_PROVIDER: ${OCR_PROVIDER:-mock}
  OCR_MODEL: ${OCR_MODEL:-qwen/qwen3-vl-32b-instruct}
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  LLM_MODEL: ${LLM_MODEL:-}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      args:
        APP: api
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SEED_OPERATOR_LOGIN: ${SEED_OPERATOR_LOGIN:-operator}
      SEED_OPERATOR_PASSWORD: ${SEED_OPERATOR_PASSWORD}
      SEED_ADMIN_LOGIN: ${SEED_ADMIN_LOGIN:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    command: ['npm', 'run', 'db:deploy', '-w', '@docflow/core']
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      args:
        APP: api
    environment:
      <<: *runtime-environment
      API_PORT: 3001
      DB_POOL_MAX: ${API_DB_POOL_MAX:-10}
      DB_CONNECTION_TIMEOUT_MS: ${API_DB_CONNECTION_TIMEOUT_MS:-10000}
      DB_STATEMENT_TIMEOUT_MS: ${API_DB_STATEMENT_TIMEOUT_MS:-30000}
      EXPORT_MAX_CONCURRENT: ${EXPORT_MAX_CONCURRENT:-4}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      LOGIN_RATE_WINDOW_SECONDS: ${LOGIN_RATE_WINDOW_SECONDS:-60}
      EXPORT_DEFAULT_DESTINATION: ${EXPORT_DEFAULT_DESTINATION:-file_json}
      GOOGLE_SHEETS_KEY_FILE: ${GOOGLE_SHEETS_KEY_FILE:-}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:-}
      GOOGLE_SHEETS_SHEET_NAME: ${GOOGLE_SHEETS_SHEET_NAME:-Documents}
      INTEGRATION_KEY_FILE: /run/keys/integration.key
    volumes:
      - ./secrets/api:/run/integrations:ro
      - ${API_INTEGRATION_KEY_DIR:-./secrets/runtime-api}:/run/keys:ro
    ports:
      - '${API_HOST_PORT}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      args:
        APP: worker
    environment:
      <<: *runtime-environment
      DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-10}
      DB_CONNECTION_TIMEOUT_MS: ${WORKER_DB_CONNECTION_TIMEOUT_MS:-10000}
      DB_STATEMENT_TIMEOUT_MS: ${WORKER_DB_STATEMENT_TIMEOUT_MS:-30000}
      OCR_PROVIDER: ${OCR_PROVIDER:-mock}
      GOOGLE_VISION_KEY_FILE: ${GOOGLE_VISION_KEY_FILE:-}
      OCR_RENDER_DPI: ${OCR_RENDER_DPI:-200}
      OCR_LANGUAGE_HINTS: ${OCR_LANGUAGE_HINTS:-ru,en}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY_FILE: ${LLM_API_KEY_FILE:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-120000}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      LLM_RESPONSE_FORMAT: ${LLM_RESPONSE_FORMAT:-json_object}
      SOURCE_PROVIDER: ${SOURCE_PROVIDER:-none}
      LOCAL_SOURCE_DIR: /data/source
      GOOGLE_DRIVE_KEY_FILE: ${GOOGLE_DRIVE_KEY_FILE:-}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      SOURCE_SYNC_INTERVAL_SECONDS: ${SOURCE_SYNC_INTERVAL_SECONDS:-300}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      ORPHAN_TTL_HOURS: ${ORPHAN_TTL_HOURS:-24}
      RETENTION_INTERVAL_SECONDS: ${RETENTION_INTERVAL_SECONDS:-3600}
      INTEGRATION_KEY_FILE: /run/keys/integration.key
    # No HTTP server by design; the worker touches this file every 10 s once
    # bootstrapped (apps/worker/src/main.ts), so `up --wait` waits for that.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "process.exit(Date.now()-require('fs').statSync('/tmp/docflow-worker-heartbeat').mtimeMs<30000?0:1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - ./docker/source-inbox:/data/source:ro
      - ./secrets/worker:/run/integrations:ro
      - ${WORKER_INTEGRATION_KEY_DIR:-./secrets/runtime-worker}:/run/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:3001
    environment:
      API_INTERNAL_URL: http://api:3001
    ports:
      - '${WEB_HOST_PORT}:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
