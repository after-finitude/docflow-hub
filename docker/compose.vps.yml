# Use with the root docker-compose.yml and prebuilt linux/amd64 images.
services:
  postgres:
    ports: !reset []
    restart: unless-stopped
    mem_limit: 256m
    command: ['postgres', '-c', 'shared_buffers=64MB', '-c', 'max_connections=40']

  redis:
    ports: !reset []
    restart: unless-stopped
    mem_limit: 128m
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '64mb', '--maxmemory-policy', 'noeviction']

  minio:
    ports: !override ['127.0.0.1:9000:9000']
    restart: unless-stopped
    mem_limit: 256m
    environment:
      GOMEMLIMIT: 192MiB

  migrate:
    build: !reset null
    image: docflow-backend:${IMAGE_TAG:?Set IMAGE_TAG to the deployed image tag}
    mem_limit: 512m

  api:
    build: !reset null
    image: docflow-backend:${IMAGE_TAG:?Set IMAGE_TAG to the deployed image tag}
    ports: !override ['127.0.0.1:3301:3001']
    restart: unless-stopped
    mem_limit: 384m
    environment:
      APP: api
      NODE_OPTIONS: --max-old-space-size=256

  worker:
    build: !reset null
    image: docflow-backend:${IMAGE_TAG:?Set IMAGE_TAG to the deployed image tag}
    restart: unless-stopped
    mem_limit: 768m
    environment:
      APP: worker
      NODE_OPTIONS: --max-old-space-size=384

  web:
    build: !reset null
    image: docflow-web:${IMAGE_TAG:?Set IMAGE_TAG to the deployed image tag}
    ports: !override ['127.0.0.1:3300:3000']
    restart: unless-stopped
    mem_limit: 256m
    environment:
      NODE_OPTIONS: --max-old-space-size=192
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - '80:80'
      - '443:443'
    environment:
      DEMO_HOST: ${DEMO_HOST:?Set DEMO_HOST to the public hostname}
      GOMEMLIMIT: 96MiB
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
